<svg xmlns="http://www.w3.org/2000/svg" width="940" height="480" viewBox="0 0 940 480" role="img" aria-labelledby="title desc"><title id="title">Conversation workspace</title><desc id="desc">Original teaching diagram. A narrow reading measure keeps long answers comfortable. History stays quiet; the conversation owns the page. The composer remains reachable without covering content.</desc><rect x="0" y="0" width="940" height="480" rx="0" fill="#fafafa"/><text xml:space="preserve" x="24" y="35" font-family="system-ui,sans-serif" font-size="23" fill="#25272b">Conversation workspace</text><text xml:space="preserve" x="24" y="61" font-family="system-ui,sans-serif" font-size="12" fill="#626771">Original composition study • illustrative content • not a product screenshot</text><rect x="24" y="86" width="555" height="344" rx="12" fill="#fff"/><rect x="24" y="90" width="112" height="338" rx="8" fill="#f0f1f3"/><text xml:space="preserve" x="38" y="118" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">Workspace</text><text xml:space="preserve" x="38" y="155" font-family="system-ui,sans-serif" font-size="11" fill="#25272b">Overview</text><text xml:space="preserve" x="38" y="187" font-family="system-ui,sans-serif" font-size="11" fill="#25272b">Inventory</text><text xml:space="preserve" x="38" y="219" font-family="system-ui,sans-serif" font-size="11" fill="#25272b">Activity</text><text xml:space="preserve" x="38" y="251" font-family="system-ui,sans-serif" font-size="11" fill="#25272b">Settings</text><text xml:space="preserve" x="180" y="120" font-family="system-ui,sans-serif" font-size="18" fill="#25272b">Project conversation</text><rect x="310" y="150" width="215" height="45" rx="8" fill="#f1f2f4"/><text xml:space="preserve" x="325" y="177" font-family="system-ui,sans-serif" font-size="11" fill="#25272b">Help me plan the next release</text><text xml:space="preserve" x="180" y="235" font-family="system-ui,sans-serif" font-size="15" fill="#25272b">A focused plan for your team</text><rect x="180" y="255" width="320" height="5" rx="2" fill="#d4d7dc"/><rect x="180" y="272" width="290" height="5" rx="2" fill="#d4d7dc"/><rect x="180" y="289" width="310" height="5" rx="2" fill="#d4d7dc"/><rect x="180" y="306" width="210" height="5" rx="2" fill="#d4d7dc"/><text xml:space="preserve" x="180" y="342" font-family="system-ui,sans-serif" font-size="10" fill="#626771">Copy    Retry</text><rect x="175" y="365" width="365" height="48" rx="18" fill="#eceef1"/><text xml:space="preserve" x="192" y="394" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">Ask a follow-up…</text><rect x="469" y="373" width="60" height="32" rx="7" fill="#25272b"/><text xml:space="preserve" x="481" y="394" font-family="system-ui,sans-serif" font-size="11" fill="#fff">Send</text><rect x="604" y="102" width="26" height="26" rx="13" fill="#25272b"/><text xml:space="preserve" x="613" y="120" font-family="system-ui,sans-serif" font-size="12" fill="#fff">1</text><text xml:space="preserve" x="645" y="119" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">A narrow reading measure keeps long</text><text xml:space="preserve" x="645" y="138" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">answers comfortable.</text><rect x="604" y="201" width="26" height="26" rx="13" fill="#25272b"/><text xml:space="preserve" x="613" y="219" font-family="system-ui,sans-serif" font-size="12" fill="#fff">2</text><text xml:space="preserve" x="645" y="218" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">History stays quiet; the</text><text xml:space="preserve" x="645" y="237" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">conversation owns the page.</text><rect x="604" y="300" width="26" height="26" rx="13" fill="#25272b"/><text xml:space="preserve" x="613" y="318" font-family="system-ui,sans-serif" font-size="12" fill="#fff">3</text><text xml:space="preserve" x="645" y="317" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">The composer remains reachable</text><text xml:space="preserve" x="645" y="336" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">without covering content.</text><text xml:space="preserve" x="24" y="457" font-family="system-ui,sans-serif" font-size="12" fill="#626771">Copy the relationships and hierarchy; adapt dimensions, tokens, and content to the product.</text></svg>