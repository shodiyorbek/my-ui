<svg xmlns="http://www.w3.org/2000/svg" width="940" height="480" viewBox="0 0 940 480" role="img" aria-labelledby="title desc"><title id="title">Empty results and recoverable errors</title><desc id="desc">Original teaching diagram. No matching results is different from having no records. Offer the action that resolves this specific state. Errors retain context and provide a persistent retry path.</desc><rect x="0" y="0" width="940" height="480" rx="0" fill="#fafafa"/><text xml:space="preserve" x="24" y="35" font-family="system-ui,sans-serif" font-size="23" fill="#25272b">Empty results and recoverable errors</text><text xml:space="preserve" x="24" y="61" font-family="system-ui,sans-serif" font-size="12" fill="#626771">Original composition study • illustrative content • not a product screenshot</text><rect x="24" y="86" width="555" height="344" rx="12" fill="#fff"/><text xml:space="preserve" x="45" y="121" font-family="system-ui,sans-serif" font-size="19" fill="#25272b">Search results</text><rect x="45" y="144" width="495" height="34" rx="8" fill="#f1f2f4"/><text xml:space="preserve" x="58" y="166" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">Search: oat milk     Category: drinks</text><text xml:space="preserve" x="155" y="227" font-family="system-ui,sans-serif" font-size="19" fill="#25272b">No matching products</text><text xml:space="preserve" x="120" y="256" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">Try another search or clear the active filters.</text><rect x="227" y="275" width="113" height="32" rx="7" fill="#eceef1"/><text xml:space="preserve" x="239" y="296" font-family="system-ui,sans-serif" font-size="11" fill="#25272b">Clear filters</text><rect x="45" y="345" width="495" height="62" rx="8" fill="#f3eceb"/><text xml:space="preserve" x="60" y="367" font-family="system-ui,sans-serif" font-size="13" fill="#25272b">Could not load the latest stock.</text><text xml:space="preserve" x="60" y="389" font-family="system-ui,sans-serif" font-size="11" fill="#25272b">Your search is preserved.</text><rect x="442" y="359" width="80" height="32" rx="7" fill="#eceef1"/><text xml:space="preserve" x="454" y="380" font-family="system-ui,sans-serif" font-size="11" fill="#25272b">Retry</text><rect x="604" y="102" width="26" height="26" rx="13" fill="#25272b"/><text xml:space="preserve" x="613" y="120" font-family="system-ui,sans-serif" font-size="12" fill="#fff">1</text><text xml:space="preserve" x="645" y="119" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">No matching results is different</text><text xml:space="preserve" x="645" y="138" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">from having no records.</text><rect x="604" y="201" width="26" height="26" rx="13" fill="#25272b"/><text xml:space="preserve" x="613" y="219" font-family="system-ui,sans-serif" font-size="12" fill="#fff">2</text><text xml:space="preserve" x="645" y="218" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">Offer the action that resolves this</text><text xml:space="preserve" x="645" y="237" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">specific state.</text><rect x="604" y="300" width="26" height="26" rx="13" fill="#25272b"/><text xml:space="preserve" x="613" y="318" font-family="system-ui,sans-serif" font-size="12" fill="#fff">3</text><text xml:space="preserve" x="645" y="317" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">Errors retain context and provide a</text><text xml:space="preserve" x="645" y="336" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">persistent retry path.</text><text xml:space="preserve" x="24" y="457" font-family="system-ui,sans-serif" font-size="12" fill="#626771">Copy the relationships and hierarchy; adapt dimensions, tokens, and content to the product.</text></svg>