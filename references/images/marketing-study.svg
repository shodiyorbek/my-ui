<svg xmlns="http://www.w3.org/2000/svg" width="940" height="480" viewBox="0 0 940 480" role="img" aria-labelledby="title desc"><title id="title">Product landing page</title><desc id="desc">Original teaching diagram. The headline explains value before decorative content. One clear next step anchors the opening section. A product demonstration supplies evidence for the claim.</desc><rect x="0" y="0" width="940" height="480" rx="0" fill="#fafafa"/><text xml:space="preserve" x="24" y="35" font-family="system-ui,sans-serif" font-size="23" fill="#25272b">Product landing page</text><text xml:space="preserve" x="24" y="61" font-family="system-ui,sans-serif" font-size="12" fill="#626771">Original composition study • illustrative content • not a product screenshot</text><rect x="24" y="86" width="555" height="344" rx="12" fill="#fff"/><text xml:space="preserve" x="45" y="119" font-family="system-ui,sans-serif" font-size="15" fill="#25272b">Studio</text><text xml:space="preserve" x="350" y="119" font-family="system-ui,sans-serif" font-size="11" fill="#25272b">Product    Pricing    Sign in</text><text xml:space="preserve" x="65" y="180" font-family="system-ui,sans-serif" font-size="26" fill="#25272b">Make room for your best work.</text><text xml:space="preserve" x="65" y="214" font-family="system-ui,sans-serif" font-size="13" fill="#25272b">Plan, write, and share in one calm workspace.</text><rect x="65" y="239" width="130" height="32" rx="7" fill="#25272b"/><text xml:space="preserve" x="77" y="260" font-family="system-ui,sans-serif" font-size="11" fill="#fff">Try your workspace</text><rect x="65" y="299" width="460" height="112" rx="8" fill="#eceef1"/><rect x="78" y="312" width="85" height="86" rx="8" fill="#dfe2e7"/><text xml:space="preserve" x="181" y="336" font-family="system-ui,sans-serif" font-size="14" fill="#25272b">Today’s project</text><rect x="181" y="353" width="290" height="5" rx="2" fill="#d4d7dc"/><rect x="181" y="370" width="260" height="5" rx="2" fill="#d4d7dc"/><rect x="181" y="387" width="210" height="5" rx="2" fill="#d4d7dc"/><rect x="604" y="102" width="26" height="26" rx="13" fill="#25272b"/><text xml:space="preserve" x="613" y="120" font-family="system-ui,sans-serif" font-size="12" fill="#fff">1</text><text xml:space="preserve" x="645" y="119" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">The headline explains value before</text><text xml:space="preserve" x="645" y="138" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">decorative content.</text><rect x="604" y="201" width="26" height="26" rx="13" fill="#25272b"/><text xml:space="preserve" x="613" y="219" font-family="system-ui,sans-serif" font-size="12" fill="#fff">2</text><text xml:space="preserve" x="645" y="218" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">One clear next step anchors the</text><text xml:space="preserve" x="645" y="237" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">opening section.</text><rect x="604" y="300" width="26" height="26" rx="13" fill="#25272b"/><text xml:space="preserve" x="613" y="318" font-family="system-ui,sans-serif" font-size="12" fill="#fff">3</text><text xml:space="preserve" x="645" y="317" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">A product demonstration supplies</text><text xml:space="preserve" x="645" y="336" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">evidence for the claim.</text><text xml:space="preserve" x="24" y="457" font-family="system-ui,sans-serif" font-size="12" fill="#626771">Copy the relationships and hierarchy; adapt dimensions, tokens, and content to the product.</text></svg>