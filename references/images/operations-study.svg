<svg xmlns="http://www.w3.org/2000/svg" width="940" height="480" viewBox="0 0 940 480" role="img" aria-labelledby="title desc"><title id="title">Operational inventory</title><desc id="desc">Original teaching diagram. Route links describe locations; an underline marks selection. Search and filters sit next to the results they affect. Wide rows support comparison; numbers share an edge.</desc><rect x="0" y="0" width="940" height="480" rx="0" fill="#fafafa"/><text xml:space="preserve" x="24" y="35" font-family="system-ui,sans-serif" font-size="23" fill="#25272b">Operational inventory</text><text xml:space="preserve" x="24" y="61" font-family="system-ui,sans-serif" font-size="12" fill="#626771">Original composition study • illustrative content • not a product screenshot</text><rect x="24" y="86" width="555" height="344" rx="12" fill="#fff"/><rect x="24" y="90" width="112" height="338" rx="8" fill="#f0f1f3"/><text xml:space="preserve" x="38" y="118" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">Workspace</text><text xml:space="preserve" x="38" y="155" font-family="system-ui,sans-serif" font-size="11" fill="#25272b">Overview</text><text xml:space="preserve" x="38" y="187" font-family="system-ui,sans-serif" font-size="11" fill="#25272b">Inventory</text><text xml:space="preserve" x="38" y="219" font-family="system-ui,sans-serif" font-size="11" fill="#25272b">Activity</text><text xml:space="preserve" x="38" y="251" font-family="system-ui,sans-serif" font-size="11" fill="#25272b">Settings</text><text xml:space="preserve" x="155" y="120" font-family="system-ui,sans-serif" font-size="19" fill="#25272b">Inventory</text><rect x="440" y="99" width="112" height="32" rx="7" fill="#25272b"/><text xml:space="preserve" x="452" y="120" font-family="system-ui,sans-serif" font-size="11" fill="#fff">Receive stock</text><text xml:space="preserve" x="155" y="160" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">Stock      Movements      Drafts</text><rect x="155" y="169" width="33" height="2" rx="0" fill="#25272b"/><rect x="155" y="190" width="235" height="32" rx="8" fill="#f1f2f4"/><text xml:space="preserve" x="167" y="211" font-family="system-ui,sans-serif" font-size="11" fill="#25272b">Search name or barcode</text><rect x="405" y="190" width="147" height="32" rx="7" fill="#eceef1"/><text xml:space="preserve" x="417" y="211" font-family="system-ui,sans-serif" font-size="11" fill="#25272b">All categories</text><rect x="155" y="240" width="400" height="28" rx="8" fill="#f1f2f4"/><text xml:space="preserve" x="167" y="259" font-family="system-ui,sans-serif" font-size="11" fill="#25272b">Product</text><text xml:space="preserve" x="362" y="259" font-family="system-ui,sans-serif" font-size="11" fill="#25272b">Quantity</text><text xml:space="preserve" x="475" y="259" font-family="system-ui,sans-serif" font-size="11" fill="#25272b">Cost</text><text xml:space="preserve" x="167" y="294" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">Milk</text><text xml:space="preserve" text-anchor="end" x="420" y="294" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">20</text><text xml:space="preserve" text-anchor="end" x="515" y="294" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">15 000</text><text xml:space="preserve" x="167" y="334" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">Bread</text><text xml:space="preserve" text-anchor="end" x="420" y="334" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">8</text><text xml:space="preserve" text-anchor="end" x="515" y="334" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">4 000</text><text xml:space="preserve" x="167" y="374" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">Coffee</text><text xml:space="preserve" text-anchor="end" x="420" y="374" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">32</text><text xml:space="preserve" text-anchor="end" x="515" y="374" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">48 000</text><rect x="604" y="102" width="26" height="26" rx="13" fill="#25272b"/><text xml:space="preserve" x="613" y="120" font-family="system-ui,sans-serif" font-size="12" fill="#fff">1</text><text xml:space="preserve" x="645" y="119" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">Route links describe locations; an</text><text xml:space="preserve" x="645" y="138" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">underline marks selection.</text><rect x="604" y="201" width="26" height="26" rx="13" fill="#25272b"/><text xml:space="preserve" x="613" y="219" font-family="system-ui,sans-serif" font-size="12" fill="#fff">2</text><text xml:space="preserve" x="645" y="218" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">Search and filters sit next to the</text><text xml:space="preserve" x="645" y="237" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">results they affect.</text><rect x="604" y="300" width="26" height="26" rx="13" fill="#25272b"/><text xml:space="preserve" x="613" y="318" font-family="system-ui,sans-serif" font-size="12" fill="#fff">3</text><text xml:space="preserve" x="645" y="317" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">Wide rows support comparison;</text><text xml:space="preserve" x="645" y="336" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">numbers share an edge.</text><text xml:space="preserve" x="24" y="457" font-family="system-ui,sans-serif" font-size="12" fill="#626771">Copy the relationships and hierarchy; adapt dimensions, tokens, and content to the product.</text></svg>