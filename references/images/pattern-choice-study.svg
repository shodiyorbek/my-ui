<svg xmlns="http://www.w3.org/2000/svg" width="940" height="480" viewBox="0 0 940 480" role="img" aria-labelledby="title desc"><title id="title">Destination links versus mode switches</title><desc id="desc">Original teaching diagram. Use links for stock, movements, and drafts destinations. Use a segmented control for local list/grid presentation. Choose behavior first; rounded styling does not decide semantics.</desc><rect x="0" y="0" width="940" height="480" rx="0" fill="#fafafa"/><text xml:space="preserve" x="24" y="35" font-family="system-ui,sans-serif" font-size="23" fill="#25272b">Destination links versus mode switches</text><text xml:space="preserve" x="24" y="61" font-family="system-ui,sans-serif" font-size="12" fill="#626771">Original composition study • illustrative content • not a product screenshot</text><rect x="24" y="86" width="555" height="344" rx="12" fill="#fff"/><text xml:space="preserve" x="45" y="122" font-family="system-ui,sans-serif" font-size="18" fill="#25272b">Related destinations</text><text xml:space="preserve" x="45" y="153" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">Separate URLs; preserve store and filters.</text><text xml:space="preserve" x="65" y="205" font-family="system-ui,sans-serif" font-size="15" fill="#25272b">Stock        Movements        Drafts</text><rect x="65" y="217" width="39" height="2" rx="0" fill="#25272b"/><text xml:space="preserve" x="45" y="281" font-family="system-ui,sans-serif" font-size="18" fill="#25272b">Local presentation mode</text><text xml:space="preserve" x="45" y="309" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">Same records, different representation.</text><rect x="65" y="336" width="204" height="43" rx="12" fill="#e7e9ed"/><rect x="69" y="340" width="96" height="35" rx="9" fill="#fff"/><text xml:space="preserve" x="95" y="363" font-family="system-ui,sans-serif" font-size="13" fill="#25272b">List</text><text xml:space="preserve" x="197" y="363" font-family="system-ui,sans-serif" font-size="13" fill="#25272b">Grid</text><rect x="604" y="102" width="26" height="26" rx="13" fill="#25272b"/><text xml:space="preserve" x="613" y="120" font-family="system-ui,sans-serif" font-size="12" fill="#fff">1</text><text xml:space="preserve" x="645" y="119" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">Use links for stock, movements, and</text><text xml:space="preserve" x="645" y="138" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">drafts destinations.</text><rect x="604" y="201" width="26" height="26" rx="13" fill="#25272b"/><text xml:space="preserve" x="613" y="219" font-family="system-ui,sans-serif" font-size="12" fill="#fff">2</text><text xml:space="preserve" x="645" y="218" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">Use a segmented control for local</text><text xml:space="preserve" x="645" y="237" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">list/grid presentation.</text><rect x="604" y="300" width="26" height="26" rx="13" fill="#25272b"/><text xml:space="preserve" x="613" y="318" font-family="system-ui,sans-serif" font-size="12" fill="#fff">3</text><text xml:space="preserve" x="645" y="317" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">Choose behavior first; rounded</text><text xml:space="preserve" x="645" y="336" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">styling does not decide semantics.</text><text xml:space="preserve" x="24" y="457" font-family="system-ui,sans-serif" font-size="12" fill="#626771">Copy the relationships and hierarchy; adapt dimensions, tokens, and content to the product.</text></svg>