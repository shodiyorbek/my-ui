<svg xmlns="http://www.w3.org/2000/svg" width="940" height="480" viewBox="0 0 940 480" role="img" aria-labelledby="title desc"><title id="title">Independent settings forms</title><desc id="desc">Original teaching diagram. Fields stay readable rather than stretching across the page. Each independent form owns its submit action. Consequences belong beside the action, not in a surprise dialog.</desc><rect x="0" y="0" width="940" height="480" rx="0" fill="#fafafa"/><text xml:space="preserve" x="24" y="35" font-family="system-ui,sans-serif" font-size="23" fill="#25272b">Independent settings forms</text><text xml:space="preserve" x="24" y="61" font-family="system-ui,sans-serif" font-size="12" fill="#626771">Original composition study • illustrative content • not a product screenshot</text><rect x="24" y="86" width="555" height="344" rx="12" fill="#fff"/><rect x="24" y="90" width="112" height="338" rx="8" fill="#f0f1f3"/><text xml:space="preserve" x="38" y="118" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">Workspace</text><text xml:space="preserve" x="38" y="155" font-family="system-ui,sans-serif" font-size="11" fill="#25272b">Overview</text><text xml:space="preserve" x="38" y="187" font-family="system-ui,sans-serif" font-size="11" fill="#25272b">Inventory</text><text xml:space="preserve" x="38" y="219" font-family="system-ui,sans-serif" font-size="11" fill="#25272b">Activity</text><text xml:space="preserve" x="38" y="251" font-family="system-ui,sans-serif" font-size="11" fill="#25272b">Settings</text><text xml:space="preserve" x="160" y="119" font-family="system-ui,sans-serif" font-size="20" fill="#25272b">Security</text><text xml:space="preserve" x="160" y="150" font-family="system-ui,sans-serif" font-size="15" fill="#25272b">Change your password</text><text xml:space="preserve" x="160" y="178" font-family="system-ui,sans-serif" font-size="11" fill="#25272b">Current password</text><rect x="160" y="187" width="270" height="32" rx="8" fill="#f1f2f4"/><text xml:space="preserve" x="160" y="244" font-family="system-ui,sans-serif" font-size="11" fill="#25272b">New password</text><rect x="160" y="253" width="270" height="32" rx="8" fill="#f1f2f4"/><text xml:space="preserve" x="160" y="310" font-family="system-ui,sans-serif" font-size="11" fill="#25272b">You will sign in again on all devices.</text><rect x="160" y="324" width="147" height="32" rx="7" fill="#25272b"/><text xml:space="preserve" x="172" y="345" font-family="system-ui,sans-serif" font-size="11" fill="#fff">Change password</text><text xml:space="preserve" x="160" y="393" font-family="system-ui,sans-serif" font-size="11" fill="#25272b">Organization policy has its own Save action.</text><rect x="604" y="102" width="26" height="26" rx="13" fill="#25272b"/><text xml:space="preserve" x="613" y="120" font-family="system-ui,sans-serif" font-size="12" fill="#fff">1</text><text xml:space="preserve" x="645" y="119" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">Fields stay readable rather than</text><text xml:space="preserve" x="645" y="138" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">stretching across the page.</text><rect x="604" y="201" width="26" height="26" rx="13" fill="#25272b"/><text xml:space="preserve" x="613" y="219" font-family="system-ui,sans-serif" font-size="12" fill="#fff">2</text><text xml:space="preserve" x="645" y="218" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">Each independent form owns its</text><text xml:space="preserve" x="645" y="237" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">submit action.</text><rect x="604" y="300" width="26" height="26" rx="13" fill="#25272b"/><text xml:space="preserve" x="613" y="318" font-family="system-ui,sans-serif" font-size="12" fill="#fff">3</text><text xml:space="preserve" x="645" y="317" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">Consequences belong beside the</text><text xml:space="preserve" x="645" y="336" font-family="system-ui,sans-serif" font-size="12" fill="#25272b">action, not in a surprise dialog.</text><text xml:space="preserve" x="24" y="457" font-family="system-ui,sans-serif" font-size="12" fill="#626771">Copy the relationships and hierarchy; adapt dimensions, tokens, and content to the product.</text></svg>